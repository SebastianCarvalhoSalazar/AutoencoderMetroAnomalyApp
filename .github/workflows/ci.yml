name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Instalar dependencias (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Tests (unitarios, integración, app, contraste de auditoría) + cobertura mínima 80 %
        run: pytest -m "not research and not e2e" --cov=metro_anomaly --cov-report=term-missing --cov-fail-under=80
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Instalar dependencias de investigación (TensorFlow)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research.txt
          pip install -e . --no-deps
      - name: Tests de detectores con autoencoder (causalidad y determinismo)
        run: pytest -m research
